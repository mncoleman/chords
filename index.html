<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chord charts built from multi-source consensus — searchable, transposable, Nashville numbers, print-ready." />
    <title>Chords</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="#/">Chord<span>s</span></a>
        <div class="search" id="search">
          <input
            id="search-input"
            type="search"
            placeholder="Search title or artist…"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search songs"
          />
          <ul id="search-results" class="search-results" hidden></ul>
        </div>
      </header>
      <main id="main"></main>
      <footer class="foot">
        <span>Charts are consensus reconstructions from public sources — always listen and verify.</span>
        <a href="https://github.com/mncoleman/chords" rel="noopener">GitHub</a>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
