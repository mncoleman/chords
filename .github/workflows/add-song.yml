name: Add song

# Server-side chart lookup: runs the multi-source web search in Actions and
# commits the resulting chart JSON, which triggers the Pages deploy.
#
# REQUIRES the ANTHROPIC_API_KEY repository secret (Settings → Secrets and
# variables → Actions). Without it the Claude CLI cannot authenticate here —
# a local subscription login does not transfer to CI. The zero-secret
# alternative is running `npm run add-song` locally; see the README.

on:
  workflow_dispatch:
    inputs:
      title:
        description: Song title
        required: true
      artist:
        description: Artist
        required: true

permissions:
  contents: write

jobs:
  add-song:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Look up chart
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # USER and TMPDIR are load-bearing: without them `claude -p` fails
          # with a misleading "Not logged in".
          USER: runner
          TMPDIR: ${{ runner.temp }}
          # Inputs go through env, never interpolated into the shell line.
          SONG_TITLE: ${{ inputs.title }}
          SONG_ARTIST: ${{ inputs.artist }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set. Add it in Settings → Secrets and variables → Actions, or use the local script (npm run add-song) instead."
            exit 1
          fi
          node scripts/add-song.mjs "$SONG_TITLE" "$SONG_ARTIST"
      - name: Commit chart
        env:
          SONG_TITLE: ${{ inputs.title }}
          SONG_ARTIST: ${{ inputs.artist }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && { echo "Nothing changed"; exit 0; }
          git commit -m "Add chart: $SONG_TITLE — $SONG_ARTIST"
          git push
