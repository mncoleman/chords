name = "chords"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# This app keeps its own user list rather than borrowing the mncoleman.com
# admin panel's. Telegram issues a PAIRWISE subject — a different id per OAuth
# client — so a person approved there is unrecognisable here anyway; the two
# lists could never have referred to the same people.
[[kv_namespaces]]
binding = "CHORDS_USERS"
id = "d006d4e267ab4e2f85e4516cb2b6a15e"
