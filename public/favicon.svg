<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="chords">
  <rect width="64" height="64" rx="14" fill="#0b0b0c"/>
  <!-- three chord rows over a lyric line: the shape of a chord chart -->
  <g fill="#7dd3fc">
    <rect x="14" y="17" width="10" height="4" rx="2"/>
    <rect x="30" y="17" width="14" height="4" rx="2"/>
    <rect x="14" y="30" width="16" height="4" rx="2"/>
    <rect x="36" y="30" width="10" height="4" rx="2"/>
    <rect x="14" y="43" width="12" height="4" rx="2"/>
    <rect x="32" y="43" width="18" height="4" rx="2"/>
  </g>
  <g fill="#3f3f46">
    <rect x="14" y="24" width="36" height="3" rx="1.5"/>
    <rect x="14" y="37" width="30" height="3" rx="1.5"/>
    <rect x="14" y="50" width="34" height="3" rx="1.5"/>
  </g>
</svg>
